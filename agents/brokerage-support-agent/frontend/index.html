<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Brokerage Support Agent</title>
  <style>
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --text: #16191f; --muted: #667085;
      --border: #e4e7ec; --accent: #1d4ed8; --error: #b42318; --code: #f2f4f7;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .app { max-width: 760px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; padding: 0 16px; }
    header { padding: 20px 0 14px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 18px; margin: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    #log { flex: 1; overflow-y: auto; padding: 20px 0; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
    .user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
    .assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .assistant.pending { color: var(--muted); font-style: italic; }
    .assistant.error { color: var(--error); }
    details.trace { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--border);
      font-size: 12px; color: var(--muted); white-space: normal; }
    details.trace summary { cursor: pointer; }
    .trace h3 { margin: 10px 0 2px; font-size: 12px; color: var(--text); display: flex; justify-content: space-between; }
    .trace .label { margin: 6px 0 2px; }
    .trace pre { margin: 0; padding: 8px 10px; background: var(--code); border-radius: 8px; color: var(--text);
      font-size: 12px; overflow-x: auto; max-height: 280px; }
    .empty { margin: auto 0; text-align: center; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
    .chip { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    form { display: flex; gap: 8px; padding: 14px 0 20px; border-top: 1px solid var(--border); }
    input { flex: 1; min-width: 0; font: inherit; padding: 11px 14px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--panel); color: var(--text); }
    input:focus { outline: none; border-color: var(--accent); }
    button.send { font: inherit; padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
    button.send:disabled { opacity: .5; cursor: default; }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>Brokerage Customer Support Agent</h1>
    <div class="sub">Signed in as demo customer ACCT-DEMO-1001 · mock data<span id="model"></span></div>
  </header>

  <div id="log">
    <div class="empty" id="empty">
      Ask about an order, a transfer, or why a trade can't be placed.
      <div class="chips">
        <button class="chip">Did my NVDA trade go through?</button>
        <button class="chip">What happened to my AMD order?</button>
        <button class="chip">Where is the $5,000 I transferred from my checking account?</button>
        <button class="chip">Did my $1,000 withdrawal go through?</button>
        <button class="chip">Why can't I place this trade?</button>
        <button class="chip">Why can't I buy 10 shares of NVDA?</button>
      </div>
    </div>
  </div>

  <form id="form">
    <input id="input" type="text" placeholder="Type a question…" autocomplete="off" autofocus>
    <button class="send" id="send">Send</button>
  </form>
</div>

<script>
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (className) node.className = className;
    return node;
  }

  // Expandable panel: which MCP tool ran, with what arguments, what it returned, how long it took.
  function traceElement(data) {
    const details = el("details", undefined, "trace");
    const names = data.tool_calls.map((t) => t.name).join(", ") || "no tool called";
    details.appendChild(el("summary", `Tool trace: ${names} · ${data.total_latency_ms} ms total`));
    for (const t of data.tool_calls) {
      const heading = el("h3");
      heading.append(el("span", `MCP tool: ${t.name}`), el("span", `${t.latency_ms} ms`));
      details.append(
        heading,
        el("div", "Arguments chosen by the model", "label"),
        el("pre", JSON.stringify(t.args, null, 2)),
        el("div", "Added by the server (not the model)", "label"),
        el("pre", JSON.stringify(t.injected, null, 2)),
        el("div", "Result", "label"),
        el("pre", JSON.stringify(t.result, null, 2)),
      );
    }
    return details;
  }

  // Add a chat bubble. Text goes in via textContent, so nothing is parsed as HTML.
  function addMessage(role, text, extraClass = "") {
    document.getElementById("empty")?.remove();
    const bubble = document.createElement("div");
    bubble.className = `msg ${role} ${extraClass}`;
    bubble.textContent = text;
    log.appendChild(bubble);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  async function ask(message) {
    addMessage("user", message);
    const bubble = addMessage("assistant", "Checking your account…", "pending");
    send.disabled = true;
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : res.statusText);

      bubble.className = "msg assistant";
      bubble.textContent = data.answer;
      bubble.appendChild(traceElement(data));
      document.getElementById("model").textContent = ` · model: ${data.model}`;
    } catch (err) {
      bubble.className = "msg assistant error";
      bubble.textContent = "Something went wrong: " + err.message;
    } finally {
      send.disabled = false;
      input.focus();
      log.scrollTop = log.scrollHeight;
    }
  }

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const message = input.value.trim();
    if (!message || send.disabled) return;
    input.value = "";
    ask(message);
  });

  // Suggested questions: clicking one sends it.
  log.addEventListener("click", (event) => {
    if (event.target.classList.contains("chip")) ask(event.target.textContent);
  });
</script>
</body>
</html>
